; MPF command-line defaults for `mpf both`.
;
; This is NOT the Godot project's config. Two files in this repo are called
; gmc.cfg and they are read by different programs:
;
;   ./gmc.cfg      (this file)  read by the `mpf both` CLI, which looks for a
;                               gmc.cfg at the MACHINE PATH, i.e. the repo
;                               root. Only the [cli] section is used.
;   ./gmc/gmc.cfg               read by Godot as res://gmc.cfg. Holds
;                               [keyboard], [sound_system] and the [mpf]
;                               section written by the editor's MPF tab.
;
; Without gmc_project_path below, `mpf both` defaults the Godot project path to
; the machine path and aborts with "Unable to find GMC project.godot file",
; because project.godot lives in gmc/. Setting it here means `mpf both -X`
; works with no extra flags.

[cli]
; Path to the Godot project folder, relative to this file. Equivalent to -g.
gmc_project_path = "gmc"
; Uncomment and set if the Godot binary is not on PATH as `godot`. Same as -G.
; godot_exec_path = "/home/pinball/.local/bin/godot"
