; Godot project config, read by GMC as res://gmc.cfg.
;
; Not to be confused with ./gmc.cfg at the repo root, which is read by the
; `mpf both` CLI for its [cli] defaults. This file is the one Godot reads.

[sound_system]
	music={"type": "solo"}
	effects={"type": "simultaneous", "simultaneous_sounds": 3, "default": true}
	voice={"type": "sequential"}

[keyboard]
	1=["switch", "s_start"]
	a=["switch", "s_left_flipper"]
	d=["switch", "s_right_flipper"]
	0=["switch", "s_outlane_left"]
	9=["switch", "s_outlane_right"]
	8=["switch", "s_inlane_left_inner"]
	7=["switch", "s_inlane_right_inner"]
	x=["switch", "s_trough2", "toggle"]
	c=["switch", "s_trough3", "toggle"]
	v=["switch", "s_trough4", "toggle"]
	b=["switch", "s_trough5", "toggle"]
	n=["switch", "s_trough6", "toggle"]
	m=["switch", "s_trough7", "toggle"]
	k=["switch", "s_trough8", "toggle"]
	q=["switch", "s_mode_drop", "toggle"]
	w=["switch", "s_mode_scoop", "toggle"]
	e=["switch", "s_left_lock_ramp"]
	r=["switch", "s_middle_loop_ramp"]
	t=["switch", "s_right_loop_ramp"]
	y=["switch", "s_backboard_ramp"]
	u=["switch", "s_middle_loop_vuk", "toggle"]
	i=["switch", "s_platform_vuk", "toggle"]
	o=["switch", "s_popup_scoop", "toggle"]
	f=["switch", "s_left_lock_1", "toggle"]
	g=["switch", "s_left_lock_2", "toggle"]
	h=["switch", "s_left_lock_3", "toggle"]
	j=["switch", "s_right_outlane_lock", "toggle"]
	l=["switch", "s_right_outlane_lock_target"]
	s=["switch", "s_platform_gate_left"]
	2=["switch", "s_popup_1", "toggle"]
	3=["switch", "s_popup_2", "toggle"]
	4=["switch", "s_popup_3", "toggle"]
	5=["switch", "s_platform_gate_right"]
	6=["switch", "s_platform_magnet"]
