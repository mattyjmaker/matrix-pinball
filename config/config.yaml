#config_version=6

# ---------------------------------------------------------------------------
# HARDWARE TEST STATE
# Devices that are not yet installed, or whose FAST switch numbers are not yet
# known, are commented out below so MPF can start against real hardware.
# Search for "TODO(hardware)" to find each one. When a device is wired and its
# number is known, restore the block and update the number.
#
# Keyboard mappings for virtual testing live in the [keyboard] section of
# gmc/gmc.cfg, not here: MPF 0.80 rejects a keyboard: section with
# CFE-ConfigProcessor-3. Each TODO(hardware) block below names the mapping to
# add when that switch is restored. Those reminders are kept here rather than
# in gmc/gmc.cfg because the Godot editor's MPF tab rewrites that file in full
# and ConfigFile.save() discards comments.
# ---------------------------------------------------------------------------

# Unwired playfield features, on the virtual platform. See that file's header.
config: playfield_pending.yaml

hardware:
    # fast drives everything wired. virtual carries the features in
    # playfield_pending.yaml that are not built or wired yet, so the full rules
    # load on the real machine. `mpf -X` still forces everything onto
    # smart_virtual.
    platform: fast, virtual

mpf:
    report_crashes: never

fast:
  net:
    debug: false      # change to true to see full NET serial communication in the log. Search for `[NET]`
    controller: neuron
    io_loop:
            # Silkscreen reads FP-I/O-0024-5 (photo, 2026-09-25). MPF 0.80
            # ignores the revision suffix but aborts if the model differs from
            # what the board reports; it does not alias FP-CAB-0001.
            # TODO(hardware): the board's NET cables were not plugged in at
            # that date. Until it is in the loop, order: 1 is wrong.
            cab:
                model: FP-I/O-0024
                order: 1
            top16:
                model: FP-I/O-1616
                order: 2
            bottom32:
                model: FP-I/O-3208
                order: 3
    port: auto
    baud: 921600
    watchdog: 1s
    default_quick_debounce_open: 2ms
    default_quick_debounce_close: 2ms
    default_normal_debounce_open: 4ms
    default_normal_debounce_close: 4ms

  exp:
    debug: false      # change to true to see full EXP serial communication in the log. Search for `[EXP]`
    port: auto
    boards:
      neuron:
        model: FP-EXP-2000
        breakouts:
          - port: 1
            model: FP-PWR-0007

machine:
  # Seven balls: the Act I rules put up to six in play (docs/11-rules-act-1.md).
  # The trough is the 8-ball PBL-100-0016-00, but only seven positions are
  # switched until the trough 1 opto is fitted, so an 8th ball would sit
  # uncounted. Raise to 8 with that opto, together with the trough fill in
  # virtual_platform_start_active_switches below. balls_installed drives
  # attract-mode ball search: MPF searches when 0 < balls known <
  # balls_installed, so the machine must physically hold this many balls or
  # it searches constantly.
  balls_installed: 7
  # min_balls is left at the MPF default of 1: the number that must be
  # accounted for before a game will start.

modes:
  - base
  - act_select
  - act_one
  - trinity_lock
  - trinity_mb
  - sentinel_gate
  - sentinel_mb
  - ch1_trinity_escape
  - ch2_red_pill
  - ch2_unplugged
  - ch3_construct
  - ch4_rescue_lock
  - ch4_rescue_mb
  - the_one

# Per-player state the rules and the HUD share. See docs/11-rules-act-1.md.
player_vars:
  act:
    initial_value: I
    value_type: str
  objective:
    initial_value: ""
    value_type: str
  # Next chapter in film order; 5 once all four have been played.
  chapter_next:
    initial_value: 1
    value_type: int
  mission_ready:
    initial_value: 0
    value_type: int
  freed_trinity:
    initial_value: 0
    value_type: int
  freed_apoc:
    initial_value: 0
    value_type: int
  freed_mouse:
    initial_value: 0
    value_type: int
  freed_tank:
    initial_value: 0
    value_type: int
  freed_switch:
    initial_value: 0
    value_type: int
  freed_dozer:
    initial_value: 0
    value_type: int
  freed_count:
    initial_value: 0
    value_type: int
  the_one_lit:
    initial_value: 0
    value_type: int
  # 0 until The One starts, then its stage (1 to 4). Survives ball end.
  the_one_stage:
    initial_value: 0
    value_type: int
  the_one_progress:
    initial_value: 0
    value_type: int
  balls_locked:
    initial_value: 0
    value_type: int
  oracle_lit:
    initial_value: 0
    value_type: int
  # Multiballs waiting for the running one to end, comma-separated.
  mb_pending:
    initial_value: ""
    value_type: str
  rescue_mb_starting:
    initial_value: 0
    value_type: int

settings:
  the_one_threshold:
    label: FREED names to light The One
    sort: 100
    values:
      4: "4"
      5: "5"
      6: "6"
    key_type: int
    default: 4


switches:
  ## Cabinet Buttons (Cabinet I/O FP-I/O-0024, io_loop name "cab")
  # Wire colours: orange out of the board input, purple on the return. See
  # docs/08-this-machine.md, "Wiring colour convention".
  # FP-I/O-0024: 24 switch inputs (cab-0 .. cab-23) and 8 drivers
  # (cab-0 .. cab-7; the knocker driver D1 on J2 is cab-7).
  # Header layout per FAST's pinout (pin 1 = lowest input):
  #   coin door (J4)            cab-0  .. cab-7
  #   CABINET A (J1)            cab-8  .. cab-15
  #   CABINET B                 cab-16 .. cab-23 (21-23 also on BILL/CARD/TICKET)
  # (FAST's docs call A and B "left" and "right"; the -5 board prints A and B.)
  # Full pinouts: docs/12-fast-boards.md, section 3.6.
  # TODO(hardware): these three numbers are the recommended defaults, not yet
  # confirmed against this machine. After wiring, verify each one in the MPF
  # service-mode switch test and correct the number if it differs.
  s_left_flipper:
    number: cab-8
    tags: left_flipper
  s_right_flipper:
    number: cab-16
    tags: right_flipper
  s_start:
    number: cab-10
    tags: start

  ## Flipper EOS Switches
  s_left_flipper_eos: # End of Stroke
    number: bottom32-25
  s_right_flipper_eos: # End of Stroke
    number: bottom32-24

    # Bottom Third Switches. Left to Right.
  s_outlane_left:
    number: bottom32-19
    tags: left_outlane, playfield_active
  s_inlane_left_outer:
    number: bottom32-18
    tags: playfield_active
  s_inlane_left_inner:
    number: bottom32-17
    tags: playfield_active
  s_inlane_right_inner:
    number: bottom32-27
    tags: playfield_active
  s_inlane_right_outer:
    number: bottom32-28
    tags: playfield_active
  s_outlane_right:
    number: bottom32-29
    tags: playfield_active

  s_sling_left:
    number: bottom32-16 ## To check
  s_sling_right:
    number: bottom32-26

  #Trough Switches (x8)
  # TODO(hardware): s_trough1 opto not yet installed. When fitted, restore it
  # here, add it to bd_trough ball_switches, and add this line to the
  # [keyboard] section of gmc/gmc.cfg:
  #     z=["switch", "s_trough1", "toggle"]
  # It is NC, so leave it out of virtual_platform_start_active_switches unless
  # it is redefined as NO. See the note on that key below.
  # s_trough1: # Opto Switch (Not yet installed)
  #   number: TODO
  #   type: NC
  s_trough2:
    number: bottom32-0
  s_trough3:
    number: bottom32-1
  s_trough4:
    number: bottom32-3
  s_trough5:
    number: bottom32-2
  s_trough6:
    number: bottom32-4
  s_trough7:
    number: bottom32-5
  s_trough8:
    number: bottom32-6
  # TODO(hardware): jam opto not yet installed. When fitted, restore it here and
  # uncomment the jam_switch / eject_coil_jam_pulse lines in bd_trough. It needs
  # no keyboard mapping, since a jam is not a state worth simulating by hand.
  # s_trough_jam:
  #   number: TODO
  #   type: NC

  # plunger lane
  # TODO(hardware): plunger lane switch not yet installed. When fitted, restore
  # it here and the bd_plunger device, set playfield default_source_device back
  # to bd_plunger, set bd_trough eject_targets back to bd_plunger, and add this
  # line to the [keyboard] section of gmc/gmc.cfg:
  #     p=["switch", "s_plunger", "toggle"]
  # s_plunger:
  #   number: TODO

  # EMP Pop Bumper Area Switches
  s_emp_pop:
    number: bottom32-14
    debounce: quick
  s_emp_trigger:
    number: bottom32-13
    tags: playfield_active
  # events_when_activated is the logical layer the modes listen to. Keep
  # the event names when renumbering a switch.
  s_emp_target_1:
    number: bottom32-9
    tags: playfield_active
    events_when_activated: emp_target_1_hit, emp_target_hit
  s_emp_target_2:
    number: bottom32-10
    tags: playfield_active
    events_when_activated: emp_target_2_hit, emp_target_hit
  s_emp_target_3:
    number: bottom32-11
    tags: playfield_active
    events_when_activated: emp_target_3_hit, emp_target_hit
  s_emp_target_4:
    number: bottom32-12
    tags: playfield_active
    events_when_activated: emp_target_4_hit, emp_target_hit
  s_kickback_target:
    number: bottom32-8
    tags: playfield_active
    events_when_activated: kickback_target_hit

  # Ammo Target
  s_ammo_target:
    number: bottom32-20
    tags: playfield_active
    events_when_activated: ammo_target_hit
  s_ammo_rollover:
    number: bottom32-21
    tags: playfield_active


coils:
  # Bottom Third Coils.
  c_auto_plunge:
    number: bottom32-0
  c_trough_eject:
    number: bottom32-1
    default_pulse_ms: 20
  c_flipper_left_hold:
    number: bottom32-2
    allow_enable: true # Allows the flipper coil power to be held (failsafe)
  c_flipper_left_main:
    number: bottom32-3
    default_pulse_ms: 10
  c_flipper_right_hold:
    number: bottom32-4
    allow_enable: true # Allows the flipper coil power to be held (failsafe)
  c_flipper_right_main:
    number: bottom32-5
    default_pulse_ms: 10
  c_sling_right:
    number: bottom32-6
    default_pulse_ms: 20
    platform_settings:
      recycle_ms: 40
  c_sling_left:
    number: bottom32-7
    default_pulse_ms: 20
    platform_settings:
      recycle_ms: 40

  # Middle Playfield Coils (in EMP)
  # TODO(hardware): pop bumper coil not yet installed.
  # c_emp_pop:
  #   number: TODO
  #   default_pulse_ms: 20
  #   platform_settings:
  #     recycle_ms: 40

autofire_coils:
  left_slingshot:
    coil: c_sling_left
    switch: s_sling_left
  right_slingshot:
    coil: c_sling_right
    switch: s_sling_right

playfields:
  playfield:
    tags: default
    # TODO(hardware): set back to bd_plunger once s_plunger is installed.
    # With no plunger switch the lane counts as playfield, so the trough is
    # the source device (MPF docs: mechs/plungers/mechanical_no_switch).
    default_source_device: bd_trough

# Seeds the trough on the virtual and smart_virtual platforms so `mpf -x/-X`
# starts with balls already in it and the start button works straight away.
# Ignored on real hardware.
#
# One switch = one ball, matching machine: balls_installed: 7 above. Keep the
# two in step. MPF counts active ball_switches and ignores their position.
#
# Every name must resolve to a switch defined above or MPF hard-errors with
# CFE-Smart_Virtual_Platform-1. The key also sets raw hardware state, which MPF
# then XORs with the switch's invert flag, so an NC switch listed here reads as
# INACTIVE. When s_trough1 and s_trough_jam are fitted, add s_trough1 here only
# if it is redefined as NO; leave s_trough_jam out either way, since a jam is
# not the normal resting state.
virtual_platform_start_active_switches: s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough7, s_trough8


flippers:
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_left_flipper
    eos_switch: s_left_flipper_eos
    use_eos: true
    # enable_events defaults to ball_started and disable_events to
    # ball_will_end, service_mode_entered. Uncomment the line below to let the
    # flippers work outside a game (useful while testing the cabinet wiring).
    # enable_events: machine_reset_phase_3
  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_right_flipper
    eos_switch: s_right_flipper_eos
    use_eos: true
    # enable_events: machine_reset_phase_3

ball_devices:
  bd_trough:
    # TODO(hardware): add s_trough1 and s_trough_jam back when installed.
    ball_switches: s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough7, s_trough8
    eject_coil: c_trough_eject
    tags: trough, home, drain
    # jam_switch: s_trough_jam # Opto switch to detect a jam in the trough
    # eject_coil_jam_pulse: 15ms
    # TODO(hardware): set back to bd_plunger once s_plunger is installed.
    eject_targets: playfield
    eject_timeouts: 3s
  # TODO(hardware): restore with s_plunger.
  # bd_plunger:
  #   ball_switches: s_plunger
  #   mechanical_eject: true
  #   eject_timeouts: 15s
  #   tags: plunger, shooter
  #   eject_coil: c_auto_plunge

slide_player:
  mode_base_started: base
  init_done: welcome
  mode_attract_started: attract
