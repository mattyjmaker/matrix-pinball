#config_version=6

# ---------------------------------------------------------------------------
# HARDWARE TEST STATE
# Devices that are not yet installed, or whose FAST switch numbers are not yet
# known, are commented out below so MPF can start against real hardware.
# Search for "TODO(hardware)" to find each one. When a device is wired and its
# number is known, restore the block and update the number.
# ---------------------------------------------------------------------------

hardware:
    platform: fast

mpf:
    report_crashes: never

fast:
  net:
    debug: false      # change to true to see full NET serial communication in the log. Search for `[NET]`
    controller: neuron
    io_loop:
            cab:
                model: FP-CAB-0001
                order: 1
            top16:
                model: FP-I/O-1616
                order: 2
            bottom32:
                model: FP-I/O-3208
                order: 3
    port: auto
    baud: 921600
    watchdog: 1s
    default_quick_debounce_open: 2ms
    default_quick_debounce_close: 2ms
    default_normal_debounce_open: 4ms
    default_normal_debounce_close: 4ms

  exp:
    debug: false      # change to true to see full EXP serial communication in the log. Search for `[EXP]`
    port: auto
    boards:
      neuron:
        model: FP-EXP-2000
        breakouts:
          - port: 1
            model: FP-PWR-0007

modes:
  - base


switches:
  ## Flipper Cabinet Buttons
  # TODO(hardware): FP-CAB-0001 switch numbers unknown. Restore these three
  # switches and the flippers: section once the cabinet inputs are confirmed.
  # s_left_flipper:
  #   number: TODO
  #   tags: left_flipper
  # s_right_flipper:
  #   number: TODO
  #   tags: right_flipper
  # s_start:
  #   number: TODO
  #   tags: start

  ## Flipper EOS Switches
  s_left_flipper_eos: # End of Stroke
    number: bottom32-25
  s_right_flipper_eos: # End of Stroke
    number: bottom32-24

    # Bottom Third Switches. Left to Right.
  s_outlane_left:
    number: bottom32-19
    tags: left_outlane, playfield_active
  s_inlane_left_outer:
    number: bottom32-18
    tags: playfield_active
  s_inlane_left_inner:
    number: bottom32-17
    tags: playfield_active
  s_inlane_right_inner:
    number: bottom32-27
    tags: playfield_active
  s_inlane_right_outer:
    number: bottom32-28
    tags: playfield_active
  s_outlane_right:
    number: bottom32-29
    tags: playfield_active

  s_sling_left:
    number: bottom32-16 ## To check
  s_sling_right:
    number: bottom32-26

  #Trough Switches (x8)
  # TODO(hardware): s_trough1 opto not yet installed. Restore here and in
  # bd_trough ball_switches when fitted.
  # s_trough1: # Opto Switch (Not yet installed)
  #   number: TODO
  #   type: NC
  s_trough2:
    number: bottom32-0
  s_trough3:
    number: bottom32-1
  s_trough4:
    number: bottom32-3
  s_trough5:
    number: bottom32-2
  s_trough6:
    number: bottom32-4
  s_trough7:
    number: bottom32-5
  s_trough8:
    number: bottom32-6
  # TODO(hardware): jam opto not yet installed. Restore here and the
  # jam_switch / eject_coil_jam_pulse lines in bd_trough when fitted.
  # s_trough_jam:
  #   number: TODO
  #   type: NC

  # plunger lane
  # TODO(hardware): plunger lane switch not yet installed. Restore here and
  # the bd_plunger device, then set playfield default_source_device back to
  # bd_plunger and bd_trough eject_targets back to bd_plunger.
  # s_plunger:
  #   number: TODO

  # EMP Pop Bumper Area Switches
  s_emp_pop:
    number: bottom32-14
    debounce: quick
  s_emp_trigger:
    number: bottom32-13
    tags: playfield_active
  s_emp_target_1:
    number: bottom32-9
    tags: playfield_active
  s_emp_target_2:
    number: bottom32-10
    tags: playfield_active
  s_emp_target_3:
    number: bottom32-11
    tags: playfield_active
  s_emp_target_4:
    number: bottom32-12
    tags: playfield_active
  s_kickback_target:
    number: bottom32-8
    tags: playfield_active

  # Ammo Target
  s_ammo_target:
    number: bottom32-20
    tags: playfield_active
  s_ammo_rollover:
    number: bottom32-21
    tags: playfield_active


coils:
  # Bottom Third Coils.
  c_auto_plunge:
    number: bottom32-0
  c_trough_eject:
    number: bottom32-1
    default_pulse_ms: 20
  c_flipper_left_hold:
    number: bottom32-2
    allow_enable: true # Allows the flipper coil power to be held (failsafe)
  c_flipper_left_main:
    number: bottom32-3
    default_pulse_ms: 10
  c_flipper_right_hold:
    number: bottom32-4
    allow_enable: true # Allows the flipper coil power to be held (failsafe)
  c_flipper_right_main:
    number: bottom32-5
    default_pulse_ms: 10
  c_sling_right:
    number: bottom32-6
    default_pulse_ms: 20
    platform_settings:
      recycle_ms: 40
  c_sling_left:
    number: bottom32-7
    default_pulse_ms: 20
    platform_settings:
      recycle_ms: 40

  # Middle Playfield Coils (in EMP)
  # TODO(hardware): pop bumper coil not yet installed.
  # c_emp_pop:
  #   number: TODO
  #   default_pulse_ms: 20
  #   platform_settings:
  #     recycle_ms: 40

autofire_coils:
  left_slingshot:
    coil: c_sling_left
    switch: s_sling_left
  right_slingshot:
    coil: c_sling_right
    switch: s_sling_right

playfields:
  playfield:
    tags: default
    # TODO(hardware): set back to bd_plunger once s_plunger is installed.
    # With no plunger switch the lane counts as playfield, so the trough is
    # the source device (MPF docs: mechs/plungers/mechanical_no_switch).
    default_source_device: bd_trough

