switches:
  ## Cabinet Buttons (Cabinet I/O FP-I/O-0024, io_loop name "cab")
  # Wire colours: orange out of the board input, purple on the return. See
  # docs/08-this-machine.md, "Wiring colour convention".
  # FP-I/O-0024: 24 switch inputs (cab-0 .. cab-23) and 8 drivers
  # (cab-0 .. cab-7; the high-current driver D1 on J2 is cab-7, the shaker).
  # Header layout per FAST's pinout (pin 1 = lowest input):
  #   coin door (J4)            cab-0  .. cab-7
  #   CABINET A (J1)            cab-8  .. cab-15
  #   CABINET B                 cab-16 .. cab-23 (21-23 also on BILL/CARD/TICKET)
  # (FAST's docs call A and B "left" and "right"; the -5 board prints A and B.)
  # Full pinouts: docs/13-fast-boards.md, section 3.6.
  # TODO(hardware): these three numbers are the recommended defaults, not yet
  # confirmed against this machine. After wiring, verify each one in the MPF
  # service-mode switch test and correct the number if it differs.
  s_left_flipper:
    number: cab-8
    tags: left_flipper
  s_right_flipper:
    number: cab-16
    tags: right_flipper
  s_start:
    number: cab-10
    tags: start
  # Williams plumb bob tilt (A-15361), wired by the user 2026-09-27 to the
  # pin labelled "18" on CABINET B (pin 3, switch 18). The tilt_warning tag is
  # what MPF's built-in tilt mode reads; that mode is not enabled yet (it
  # needs a GMC "tilt" slide).
  # TODO(hardware): confirm in the switch test.
  s_plumb_bob:
    number: cab-18
    tags: tilt_warning
  # Cabinet power button (front right, LED ring), used as an ordinary switch
  # until FAST releases soft power (then its switch pair moves to the Neuron's
  # J4). One switch lead is on the tilt's purple return; the other goes to the
  # pin labelled "19" on CABINET B (pin 4, switch 19); wired by the user
  # 2026-10-01. Not used by any rule yet.
  # TODO(hardware): not yet switch-tested. If it reads active when released,
  # the pair is normally closed: add type: NC.
  s_cabinet_button:
    number: cab-19

  ## Flipper EOS Switches
  s_left_flipper_eos: # End of Stroke
    number: bottom32-25
  s_right_flipper_eos: # End of Stroke
    number: bottom32-24

    # Bottom Third Switches. Left to Right.
  s_outlane_left:
    number: bottom32-19
    tags: left_outlane, playfield_active
  s_inlane_left_outer:
    number: bottom32-18
    tags: playfield_active
  s_inlane_left_inner:
    number: bottom32-17
    tags: playfield_active
  s_inlane_right_inner:
    number: bottom32-27
    tags: playfield_active
  s_inlane_right_outer:
    number: bottom32-28
    tags: playfield_active
  s_outlane_right:
    number: bottom32-29
    tags: playfield_active

  s_sling_left:
    number: bottom32-16 ## To check
  s_sling_right:
    number: bottom32-26

  #Trough Switches (x8)
  # TODO(hardware): s_trough1 opto not yet installed. When fitted, restore it
  # here, add it to bd_trough ball_switches, and add this line to the
  # [keyboard] section of gmc/gmc.cfg:
  #     z=["switch", "s_trough1", "toggle"]
  # It is NC, so leave it out of virtual_platform_start_active_switches unless
  # it is redefined as NO. See the note on that key below.
  # s_trough1: # Opto Switch (Not yet installed)
  #   number: TODO
  #   type: NC
  s_trough2:
    number: bottom32-0
  s_trough3:
    number: bottom32-1
  s_trough4:
    number: bottom32-3
  s_trough5:
    number: bottom32-2
  s_trough6:
    number: bottom32-4
  s_trough7:
    number: bottom32-5
  s_trough8:
    number: bottom32-6
  # TODO(hardware): jam opto not yet installed. When fitted, restore it here and
  # uncomment the jam_switch / eject_coil_jam_pulse lines in bd_trough. It needs
  # no keyboard mapping, since a jam is not a state worth simulating by hand.
  # s_trough_jam:
  #   number: TODO
  #   type: NC

  # plunger lane
  # TODO(hardware): plunger lane switch not yet installed. When fitted, restore
  # it here and the bd_plunger device, set playfield default_source_device back
  # to bd_plunger, set bd_trough eject_targets back to bd_plunger, and add this
  # line to the [keyboard] section of gmc/gmc.cfg:
  #     p=["switch", "s_plunger", "toggle"]
  # s_plunger:
  #   number: TODO

  # Pop bumper area (the "EMP" area in the Matrix design). Every hardware
  # name in this file and in playfield_pending.yaml is generic: it says what
  # the feature is, not what a game calls it, so every game listens to the
  # same events. Each game's modes and docs carry the mapping to that game's
  # names (docs/11-rules-act-1.md section 11, docs/12-rules-terminator-2.md
  # section 4). Keep the event names when renumbering a switch.
  s_pop_bumper_1:                 # was s_emp_pop
    number: bottom32-14
    debounce: quick
  s_pop_trigger:                  # was s_emp_trigger
    number: bottom32-13
    tags: playfield_active
  s_pop_target_1:                 # was s_emp_target_1
    number: bottom32-9
    tags: playfield_active
    events_when_activated: pop_target_1_hit, pop_target_hit
  s_pop_target_2:
    number: bottom32-10
    tags: playfield_active
    events_when_activated: pop_target_2_hit, pop_target_hit
  s_pop_target_3:
    number: bottom32-11
    tags: playfield_active
    events_when_activated: pop_target_3_hit, pop_target_hit
  s_pop_target_4:
    number: bottom32-12
    tags: playfield_active
    events_when_activated: pop_target_4_hit, pop_target_hit
  s_kickback_target:
    number: bottom32-8
    tags: playfield_active
    events_when_activated: kickback_target_hit

  # Standup and rollover at the bottom right outlane lock (the "Ammo" lock
  # and target in the Matrix design).
  s_right_outlane_lock_target:    # was s_ammo_target
    number: bottom32-20
    tags: playfield_active
    events_when_activated: right_outlane_lock_target_hit
  s_right_outlane_lock_rollover:  # was s_ammo_rollover
    number: bottom32-21
    tags: playfield_active


coils:
  # Bottom Third Coils.
  c_auto_plunge:
    number: bottom32-0
  c_trough_eject:
    number: bottom32-1
    default_pulse_ms: 20
  c_flipper_left_hold:
    number: bottom32-2
    allow_enable: true # Allows the flipper coil power to be held (failsafe)
  c_flipper_left_main:
    number: bottom32-3
    default_pulse_ms: 10
  c_flipper_right_hold:
    number: bottom32-4
    allow_enable: true # Allows the flipper coil power to be held (failsafe)
  c_flipper_right_main:
    number: bottom32-5
    default_pulse_ms: 10
  c_sling_right:
    number: bottom32-6
    default_pulse_ms: 20
    platform_settings:
      recycle_ms: 40
  c_sling_left:
    number: bottom32-7
    default_pulse_ms: 20
    platform_settings:
      recycle_ms: 40

  # Cabinet I/O low-current driver L2 (CABINET A pin 11) switches the start
  # button lamp's return; its 12 V comes from the left opto board J1 pin 7.
  # Driven through l_start below (FAST's cabinet recipe). Wired 2026-09-26;
  # not yet tested on the machine.
  c_start_lamp:
    number: cab-2
    allow_enable: true

  # Cabinet I/O low-current driver L4 (CABINET B pin 11) switches the LED
  # ring of the cabinet power button (black lead); its red lead takes 12 V
  # from the right opto board J1 pin 7. Planned 2026-09-26; not yet wired.
  c_power_button_led:
    number: cab-4
    allow_enable: true

  # JJP shaker motor (12 V DC) on the Cabinet I/O's only high-current driver
  # (J2 D1, driver 7). Motor + from SHAKER PWR +; this driver switches the
  # motor's - side. 1N4001/1N4007 flyback diode across the motor, band to +.
  # TODO(hardware): conservative placeholder values until the motor's winding
  # resistance and running current are measured. Enabling gives a short
  # full-power kick to start it, then PWM hold at half power, capped at half
  # power and 3 s per enable so a stuck enable cannot run it indefinitely.
  c_shaker:
    number: cab-7
    allow_enable: true
    default_pulse_ms: 50
    default_hold_power: 0.5
    max_hold_power: 0.5
    max_hold_duration: 3s

  # Pop bumper area
  # TODO(hardware): pop bumper coil not yet installed.
  # c_pop_bumper_1:
  #   number: TODO
  #   default_pulse_ms: 20
  #   platform_settings:
  #     recycle_ms: 40

lights:
  l_start:
    number: c_start_lamp
    platform: drivers
    type: w
  l_power_button:
    number: c_power_button_led
    platform: drivers
    type: w

autofire_coils:
  left_slingshot:
    coil: c_sling_left
    switch: s_sling_left
  right_slingshot:
    coil: c_sling_right
    switch: s_sling_right

playfields:
  playfield:
    tags: default
    # TODO(hardware): set back to bd_plunger once s_plunger is installed.
    # With no plunger switch the lane counts as playfield, so the trough is
    # the source device (MPF docs: mechs/plungers/mechanical_no_switch).
    default_source_device: bd_trough

# Seeds the trough on the virtual and smart_virtual platforms so `mpf -x/-X`
# starts with balls already in it and the start button works straight away.
# Ignored on real hardware.
#
# One trough switch = one ball, matching machine: balls_installed: 7 above.
# Keep the two in step. MPF counts active ball_switches and ignores their
# position.
#
# Every name must resolve to a switch defined above or MPF hard-errors with
# CFE-Smart_Virtual_Platform-1. The virtual platforms start every switch
# inactive, NC or not, and a listed switch starts active (MPF 0.80
# `platforms/virtual.py`: the raw state starts at the invert flag and listing
# flips it). When s_trough1 and s_trough_jam are fitted, add s_trough1 here;
# leave s_trough_jam out, since a jam is not the normal resting state. The
# pop-up up switches are listed so the pop-ups start down, as they are at
# power-on (NC: active means down).
virtual_platform_start_active_switches: s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough7, s_trough8, s_popup_1_up, s_popup_2_up, s_popup_3_up


flippers:
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_left_flipper
    eos_switch: s_left_flipper_eos
    use_eos: true
    # enable_events defaults to ball_started and disable_events to
    # ball_will_end, service_mode_entered. Uncomment the line below to let the
    # flippers work outside a game (useful while testing the cabinet wiring).
    # enable_events: machine_reset_phase_3
  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_right_flipper
    eos_switch: s_right_flipper_eos
    use_eos: true
    # enable_events: machine_reset_phase_3

ball_devices:
  bd_trough:
    # TODO(hardware): add s_trough1 and s_trough_jam back when installed.
    ball_switches: s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough7, s_trough8
    eject_coil: c_trough_eject
    tags: trough, home, drain
    # jam_switch: s_trough_jam # Opto switch to detect a jam in the trough
    # eject_coil_jam_pulse: 15ms
    # TODO(hardware): set back to bd_plunger once s_plunger is installed.
    eject_targets: playfield
    eject_timeouts: 3s
