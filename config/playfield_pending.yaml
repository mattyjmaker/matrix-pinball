#config_version=6

# ---------------------------------------------------------------------------
# PENDING PLAYFIELD HARDWARE
#
# Every playfield feature that is not yet built or wired. Included from
# config.yaml with `config: playfield_pending.yaml`.
#
# Everything here is on the `virtual` platform (see `hardware: platform:` in
# config.yaml), so MPF still boots on the real FAST hardware: these switches
# never close and these coils do nothing until the feature is wired. On
# `mpf -X` everything is simulated, which is how the rules are developed and
# tested (see tests/).
#
# To bring a feature online: move its entries into config.yaml, give each
# switch and coil its real FAST number, and delete the `platform: virtual`
# line. Keep the switch names and `events_when_activated:` lines as they are.
#
# NAMES ARE GENERIC. Every switch, coil, device and event here says what the
# hardware is (`left_lock_ramp`, `platform_gate`, `popup_1`), never what a
# game calls it. The games share this playfield and listen to the same
# events; each game's modes and docs carry the mapping to its own names. The
# Matrix name each feature had before the rename is in a comment beside it.
#
# TODO(layout): which side of the playfield each shot is on is a guess until
# the ramps are installed. The Construct's sparring combos alternate
# `left_shot_hit` and `right_shot_hit`, so correct those two events per
# switch once the layout is final. The middle loop ramp counts as a left
# shot for now.
# ---------------------------------------------------------------------------

switches:
  # Pop-ups: three Hobbit pop-up beast assemblies, driven as drop targets
  # (the "Agents" in the Matrix design). Active means the pop-up is down.
  # Drop target switches take no playfield_active tag; the device marks the
  # playfield active itself.
  s_popup_1:                      # was s_agent_1
    number: v-popup-1
    platform: virtual
  s_popup_2:
    number: v-popup-2
    platform: virtual
  s_popup_3:
    number: v-popup-3
    platform: virtual

  # Five-bank: Gottlieb 5-bank drop targets (the "Matrix Team" drops).
  s_five_bank_1:                  # was s_team_1
    number: v-five-bank-1
    platform: virtual
  s_five_bank_2:
    number: v-five-bank-2
    platform: virtual
  s_five_bank_3:
    number: v-five-bank-3
    platform: virtual
  s_five_bank_4:
    number: v-five-bank-4
    platform: virtual
  s_five_bank_5:
    number: v-five-bank-5
    platform: virtual

  # Three-bank: 3-bank drop target assembly in the pop bumper area (parts
  # list). No rules use it yet.
  s_three_bank_1:
    number: v-three-bank-1
    platform: virtual
  s_three_bank_2:
    number: v-three-bank-2
    platform: virtual
  s_three_bank_3:
    number: v-three-bank-3
    platform: virtual

  # Mode drop and mode scoop: a 1-bank smart drop in front of the scoop that
  # starts the game's modes (the "Mission Drop" and "Mission scoop").
  s_mode_drop:                    # was s_mission_drop
    number: v-mode-drop
    platform: virtual
  s_mode_scoop:                   # was s_mission_scoop
    number: v-mode-scoop
    platform: virtual

  # Pop-up scoop: the open-back scoop that raises the pop-ups (the "Agents
  # Coming" or Cypher scoop).
  s_popup_scoop:                  # was s_cypher_scoop
    number: v-popup-scoop
    platform: virtual

  # Ramps. Four, each with a "made" switch at the top:
  #   left lock ramp    the left ramp, with the lock post on its return
  #   middle loop ramp  the middle loop
  #   right loop ramp   the loop on the far right, up and in front of the
  #                     backboard onto the upper playfield from the left
  #   backboard ramp    next to the platform toy, up into the backboard and
  #                     behind it, out at the top left of the upper playfield
  # The first three have spinners; the backboard ramp has an opto set.
  # (The Matrix design's Trinity, Deja Vu, Real World and Sentinel ramps.)
  s_left_lock_ramp:               # was s_trinity_ramp
    number: v-left-lock-ramp
    platform: virtual
    tags: playfield_active
    events_when_activated: left_lock_ramp_hit, ramp_hit, left_shot_hit
  s_left_lock_spinner:            # was s_trinity_spinner
    number: v-left-lock-spinner
    platform: virtual
    tags: playfield_active
    events_when_activated: spinner_hit
  s_middle_loop_ramp:             # was s_dejavu_ramp
    number: v-middle-loop-ramp
    platform: virtual
    tags: playfield_active
    events_when_activated: middle_loop_ramp_hit, ramp_hit, left_shot_hit
  s_middle_loop_spinner:          # was s_dejavu_spinner
    number: v-middle-loop-spinner
    platform: virtual
    tags: playfield_active
    events_when_activated: spinner_hit
  s_right_loop_ramp:              # was s_real_world_ramp
    number: v-right-loop-ramp
    platform: virtual
    tags: playfield_active
    events_when_activated: right_loop_ramp_hit, ramp_hit, right_shot_hit
  s_right_loop_spinner:           # was s_real_world_spinner
    number: v-right-loop-spinner
    platform: virtual
    tags: playfield_active
    events_when_activated: spinner_hit
  s_backboard_ramp:               # was s_sentinel_ramp
    number: v-backboard-ramp
    platform: virtual
    tags: playfield_active
    events_when_activated: backboard_ramp_hit, ramp_hit, right_shot_hit

  # Upper playfield: three standups and a mini left flipper (the "Real
  # World" playfield). Both the right loop ramp and the backboard ramp feed it.
  s_upper_target_1:               # was s_real_world_1
    number: v-upper-target-1
    platform: virtual
    tags: playfield_active
    events_when_activated: upper_target_1_hit, upper_target_hit
  s_upper_target_2:
    number: v-upper-target-2
    platform: virtual
    tags: playfield_active
    events_when_activated: upper_target_2_hit, upper_target_hit
  s_upper_target_3:
    number: v-upper-target-3
    platform: virtual
    tags: playfield_active
    events_when_activated: upper_target_3_hit, upper_target_hit

  # Platform toy (the "Sentinel Boss"): two targets on a rising platform,
  # two front targets that lower and rise to block the path to it, a magnet,
  # and a subway under the raised platform. The two front targets are the
  # gate (the square standups); the two on the platform are the platform
  # targets (the rectangular standup, and a second one the config did not
  # have before).
  s_platform_gate_left:           # was s_sentinel_left
    number: v-platform-gate-left
    platform: virtual
    tags: playfield_active
    events_when_activated: platform_gate_left_hit, platform_gate_hit
  s_platform_gate_right:          # was s_sentinel_right
    number: v-platform-gate-right
    platform: virtual
    tags: playfield_active
    events_when_activated: platform_gate_right_hit, platform_gate_hit
  s_platform_target_1:            # was s_sentinel_boss
    number: v-platform-target-1
    platform: virtual
    tags: playfield_active
    events_when_activated: platform_target_1_hit, platform_target_hit
  s_platform_target_2:
    number: v-platform-target-2
    platform: virtual
    tags: playfield_active
    events_when_activated: platform_target_2_hit, platform_target_hit
  # Magnet grab switch: a ball is over the platform magnet.
  s_platform_magnet:              # was s_sentinel_magnet
    number: v-platform-magnet
    platform: virtual
    tags: playfield_active
    events_when_activated: platform_magnet_hit
  # TODO(hardware): on the real toy a raised platform reveals a subway that
  # carries the ball to the middle loop VUK; there is no separate VUK in the
  # toy. This device stands in for "a ball went under the platform" until
  # the toy is built. Then decide whether it becomes a subway entrance switch
  # (with the ball arriving at bd_middle_loop_vuk) and give the rules that
  # await balldevice_bd_platform_vuk_ball_entered a condition on the platform
  # being raised.
  s_platform_vuk:                 # was s_sentinel_vuk
    number: v-platform-vuk
    platform: virtual

  # Middle loop VUK (the "Deja Vu" VUK): closed-back scoop weldment.
  s_middle_loop_vuk:              # was s_dejavu_vuk
    number: v-middle-loop-vuk
    platform: virtual

  # Left lock: the left lock ramp's return path to the flippers, with a post
  # that rises to hold balls on it (the "Trinity" lock).
  # TODO(hardware): the real lock has no position switches. A ball is locked
  # when it makes the ramp while the post is up, and the lock is assumed full
  # at three. These three switches let the simulator and the tests count
  # balls; when the lock is built, replace them with entrance-switch counting
  # on s_left_lock_ramp gated on the post being up.
  s_left_lock_1:                  # was s_trinity_lock_1
    number: v-left-lock-1
    platform: virtual
  s_left_lock_2:
    number: v-left-lock-2
    platform: virtual
  s_left_lock_3:
    number: v-left-lock-3
    platform: virtual

  # Right outlane lock: Stern ball lock assembly holding one ball at the
  # bottom right outlane (the "Ammo" lock).
  s_right_outlane_lock:           # was s_ammo_lock
    number: v-right-outlane-lock
    platform: virtual

coils:
  c_popup_1_raise:                # was c_agent_1_raise
    number: v-popup-1-raise
    platform: virtual
    default_pulse_ms: 30
  c_popup_2_raise:
    number: v-popup-2-raise
    platform: virtual
    default_pulse_ms: 30
  c_popup_3_raise:
    number: v-popup-3-raise
    platform: virtual
    default_pulse_ms: 30
  c_five_bank_reset:              # was c_team_reset
    number: v-five-bank-reset
    platform: virtual
    default_pulse_ms: 30
  c_three_bank_reset:
    number: v-three-bank-reset
    platform: virtual
    default_pulse_ms: 30
  c_mode_drop_reset:              # was c_mission_drop_reset
    number: v-mode-drop-reset
    platform: virtual
    default_pulse_ms: 30
  c_mode_scoop:                   # was c_mission_scoop
    number: v-mode-scoop
    platform: virtual
    default_pulse_ms: 25
  c_popup_scoop:                  # was c_cypher_scoop
    number: v-popup-scoop
    platform: virtual
    default_pulse_ms: 25
  c_middle_loop_vuk:              # was c_dejavu_vuk
    number: v-middle-loop-vuk
    platform: virtual
    default_pulse_ms: 25
  c_platform_vuk:                 # was c_sentinel_vuk
    number: v-platform-vuk
    platform: virtual
    default_pulse_ms: 25
  # TODO(hardware): the post drops to release every held ball at once, not
  # one ball per pulse. Revisit with the lock's counting model above.
  c_left_lock_post:               # was c_trinity_lock_release
    number: v-left-lock-post
    platform: virtual
    default_pulse_ms: 25
  c_right_outlane_lock_release:   # was c_ammo_lock_release
    number: v-right-outlane-lock-release
    platform: virtual
    default_pulse_ms: 25
  c_platform_gate:                # was c_sentinel_gate
    number: v-platform-gate
    platform: virtual
    allow_enable: true
    default_pulse_ms: 30
    default_hold_power: 0.25
  # TODO(hardware): the platform itself rises to reveal the subway. No rule
  # drives it yet.
  c_platform_raise:
    number: v-platform-raise
    platform: virtual
    allow_enable: true
    default_pulse_ms: 30
    default_hold_power: 0.25
  c_platform_magnet:              # was c_sentinel_magnet
    number: v-platform-magnet
    platform: virtual
    allow_enable: true
    default_pulse_ms: 100
    default_hold_power: 0.375

drop_targets:
  popup_1:                        # was agent_1
    switch: s_popup_1
    reset_coil: c_popup_1_raise
    reset_events: popup_1_raise
  popup_2:
    switch: s_popup_2
    reset_coil: c_popup_2_raise
    reset_events: popup_2_raise
  popup_3:
    switch: s_popup_3
    reset_coil: c_popup_3_raise
    reset_events: popup_3_raise
  five_bank_1:                    # was team_1
    switch: s_five_bank_1
  five_bank_2:
    switch: s_five_bank_2
  five_bank_3:
    switch: s_five_bank_3
  five_bank_4:
    switch: s_five_bank_4
  five_bank_5:
    switch: s_five_bank_5
  three_bank_1:
    switch: s_three_bank_1
  three_bank_2:
    switch: s_three_bank_2
  three_bank_3:
    switch: s_three_bank_3
  mode_drop:                      # was mission_drop
    switch: s_mode_drop
    reset_coil: c_mode_drop_reset
    reset_events: machine_reset_phase_3, ball_starting, mode_drop_reset

drop_target_banks:
  popups:                         # was agents
    drop_targets: popup_1, popup_2, popup_3
    reset_events: machine_reset_phase_3, ball_starting, popups_raise
  five_bank:                      # was matrix_team
    drop_targets: five_bank_1, five_bank_2, five_bank_3, five_bank_4, five_bank_5
    reset_coil: c_five_bank_reset
    reset_events: machine_reset_phase_3, ball_starting, five_bank_reset
  three_bank:
    drop_targets: three_bank_1, three_bank_2, three_bank_3
    reset_coil: c_three_bank_reset
    reset_events: machine_reset_phase_3, ball_starting, three_bank_reset

ball_devices:
  bd_mode_scoop:                  # was bd_mission_scoop
    ball_switches: s_mode_scoop
    eject_coil: c_mode_scoop
    eject_timeouts: 3s
  bd_popup_scoop:                 # was bd_cypher_scoop
    ball_switches: s_popup_scoop
    eject_coil: c_popup_scoop
    eject_timeouts: 3s
  bd_middle_loop_vuk:             # was bd_dejavu_vuk
    ball_switches: s_middle_loop_vuk
    eject_coil: c_middle_loop_vuk
    eject_timeouts: 3s
  bd_platform_vuk:                # was bd_sentinel_vuk; see the TODO on s_platform_vuk
    ball_switches: s_platform_vuk
    eject_coil: c_platform_vuk
    eject_timeouts: 3s
  bd_left_lock:                   # was bd_trinity_lock
    ball_switches: s_left_lock_1, s_left_lock_2, s_left_lock_3
    eject_coil: c_left_lock_post
    eject_timeouts: 3s
  bd_right_outlane_lock:          # was bd_ammo_lock
    ball_switches: s_right_outlane_lock
    eject_coil: c_right_outlane_lock_release
    eject_timeouts: 3s

diverters:
  # The platform gate: the two front targets lower to open the path to the
  # platform and rise to block it. Active means open (targets down).
  # TODO(hardware): modelled as a held coil, and it is not yet known whether
  # the energised state is up or down. Change `type` and the coils to match
  # the mech as built.
  platform_gate:                  # was sentinel_gate
    activation_coil: c_platform_gate
    type: hold
    # A diverter ignores activate events until it is enabled.
    enable_events: ball_started
    disable_events: ball_will_end, service_mode_entered
    activate_events: platform_gate_open
    deactivate_events: platform_gate_close, ball_will_end

magnets:
  platform_magnet:                # was sentinel_magnet
    magnet_coil: c_platform_magnet
    grab_switch: s_platform_magnet
    grab_time: 1.5s
    release_time: 500ms
    grab_ball_events: platform_magnet_grab
    release_ball_events: platform_magnet_release

# Not yet modelled, because each ties a FAST switch to a coil through a
# hardware rule and both halves must be on the same platform:
# - the kickback coil (left outlane, relit by s_kickback_target),
# - the upper right flipper (a third lower-playfield flipper), and
# - the upper playfield's mini left flipper.
# Add each as `kickbacks:` / `flippers:` in config.yaml once its coil is wired.
