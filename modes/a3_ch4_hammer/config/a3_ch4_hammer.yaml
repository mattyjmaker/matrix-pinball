#config_version=6

# Act III, Chapter 4: The Hammer. Single ball, two timed stages.
#   The tunnels (40 s): Niobe flies the service tunnels. The four ramps in
#     order, left to right: Trinity, Deja Vu, Real World, Sentinel. A ramp
#     out of order does not count.
#   The EMP (15 s): the Hammer reaches the dock. The Deja Vu VUK fires it.
# Either running out of time ends the chapter, played but not completed.
# The EMP adds ROLAND, the Hammer's captain, to the DEFENDERS.
# See docs/15-rules-act-3.md, section 3.

mode:
  start_events: start_a3_ch4
  stop_events: a3_ch4_completed, a3_ch4_failed
  events_when_stopped: a3_ch4_ended
  priority: 300

sequences:
  a3_tunnels:
    events:
      - left_lock_ramp_hit
      - middle_loop_ramp_hit
      - right_loop_ramp_hit
      - backboard_ramp_hit
    events_when_complete: a3_tunnels_done
    start_enabled: true

timers:
  a3_ch4_tunnels:
    start_value: 40
    end_value: 0
    direction: down
    start_running: true
    control_events:
      - event: a3_tunnels_done
        action: stop
  a3_ch4_emp:
    start_value: 15
    end_value: 0
    direction: down
    control_events:
      - event: a3_tunnels_done
        action: start

event_player:
  timer_a3_ch4_tunnels_complete: a3_ch4_failed
  timer_a3_ch4_emp_complete: a3_ch4_failed
  balldevice_bd_middle_loop_vuk_ball_entered{device.timers.a3_ch4_emp.running}: a3_ch4_emp_fired
  a3_ch4_emp_fired: a3_ch4_completed

variable_player:
  mode_a3_ch4_hammer_started:
    objective:
      action: set
      string: "THE TUNNELS: TRINITY, DEJA VU, REAL WORLD, SENTINEL RAMPS IN ORDER"
  logicblock_a3_tunnels_hit:
    score: 100000
  a3_tunnels_done:
    objective:
      action: set
      string: "THE EMP: SHOOT THE DEJA VU VUK"
  a3_ch4_emp_fired:
    score: 750000

# The failure callout is in act_three.yaml: this mode's widgets are cleared
# when it stops.
widget_player:
  mode_a3_ch4_hammer_started:
    video_clip:
      tokens:
        clip: hammer_tunnels
      expire: 6s
    chapter_card:
      priority: 10
      tokens:
        kicker: ACT III  CHAPTER 4
        title: THE HAMMER
        goal: THE FOUR RAMPS, LEFT TO RIGHT
      expire: 5s
    countdown:
      key: a3_ch4_clock
      priority: 10
      tokens:
        label: THE TUNNELS
        event: timer_a3_ch4_tunnels_tick
        seconds: "40"
  a3_tunnels_done:
    countdown:
      key: a3_ch4_clock
      action: update
      tokens:
        label: FIRE THE EMP
        event: timer_a3_ch4_emp_tick
        seconds: "15"
        total: "15"
