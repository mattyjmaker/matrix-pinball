#config_version=6

# Sentinel Hunt: Act II's re-skin of Sentinel Multiball, the machines
# searching the tunnels. 3 balls. Jackpots on the backboard ramp (the
# Sentinel ramp) and either platform target; four jackpots ally GHOST.
# Add-a-ball, once per multiball: hit both gate targets and a platform target
# to light it, then shoot the platform VUK. Peaks at 4 balls.
# See docs/14-rules-act-2.md, section 4.

mode:
  start_events: start_hunt_mb
  stop_events: multiball_hunt_ended
  priority: 320

multiballs:
  hunt:
    ball_count: 3
    ball_count_type: total
    shoot_again: 20s
    start_events: mode_hunt_mb_started
    add_a_ball_events: hunt_add_a_ball
    add_a_ball_shoot_again: 10s

accruals:
  hunt_add_a_ball_targets:
    events:
      - platform_gate_left_hit
      - platform_gate_right_hit
      - platform_target_hit
    events_when_complete: hunt_add_a_ball_lit
    start_enabled: true

counters:
  hunt_jackpots:
    count_events: hunt_jackpot
    count_complete_value: 4
    events_when_complete: hunt_mb_completed
    start_enabled: true

event_player:
  backboard_ramp_hit: hunt_jackpot
  platform_target_hit: hunt_jackpot
  balldevice_bd_platform_vuk_ball_entered{current_player.hunt_aab_lit==1}: hunt_add_a_ball

variable_player:
  mode_hunt_mb_started:
    objective:
      action: set
      string: "SENTINEL HUNT: SENTINEL RAMP AND BOSS FOR JACKPOTS"
    hunt_aab_lit:
      action: set
      int: 0
  hunt_jackpot:
    score: 150000
  hunt_add_a_ball_lit:
    hunt_aab_lit:
      action: set
      int: 1
  hunt_add_a_ball:
    hunt_aab_lit:
      action: set
      int: 0

widget_player:
  mode_hunt_mb_started:
    video_clip:
      tokens:
        clip: sentinel_hunt
      expire: 6s
    chapter_card:
      priority: 10
      tokens:
        kicker: MULTIBALL
        title: SENTINEL HUNT
        goal: SENTINEL RAMP AND BOSS FOR JACKPOTS
      expire: 4s
  hunt_add_a_ball_lit:
    mode_banner:
      tokens:
        title: ADD-A-BALL LIT
        detail: SHOOT THE SENTINEL VUK
      expire: 3s
  hunt_jackpot:
    mode_banner:
      tokens:
        title: JACKPOT
        detail: ""
      expire: 2s
