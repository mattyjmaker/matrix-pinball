#config_version=6

# Future War Multiball: 3 balls, released from the left lock. "Resistance
# Bonus" jackpots on the Future War Ramp (left lock ramp). Three jackpots save
# RESISTANCE. See docs/12-rules-terminator-2.md, section 8.

mode:
  start_events: start_future_war_mb
  stop_events: multiball_future_war_ended
  priority: 320

multiballs:
  future_war:
    ball_count: 3
    ball_count_type: total
    ball_locks: bd_left_lock
    shoot_again: 20s
    start_events: mode_future_war_mb_started

counters:
  fw_jackpots:
    count_events: left_lock_ramp_hit
    count_complete_value: 3
    events_when_complete: future_war_mb_completed
    start_enabled: true

variable_player:
  mode_future_war_mb_started:
    objective:
      action: set
      string: "FUTURE WAR: FUTURE WAR RAMP FOR JACKPOTS"
  left_lock_ramp_hit:
    score: 150000

widget_player:
  mode_future_war_mb_started:
    video_clip:
      tokens:
        clip: future_war_flash
      expire: 6s
    t2_card:
      priority: 10
      tokens:
        kicker: MULTIBALL
        title: FUTURE WAR
        goal: FUTURE WAR RAMP FOR JACKPOTS
      expire: 4s
  left_lock_ramp_hit:
    t2_banner:
      tokens:
        title: RESISTANCE BONUS
        detail: JACKPOT
      expire: 2s
