#config_version=6

# Act select, before each player's first ball. Logic in code/act_select.py.
# Skipped while only Act I has rules. See docs/11-rules-act-1.md, section 5.

mode:
  start_events: ball_starting{ball==1}
  use_wait_queue: true
  priority: 1000
  code: act_select.ActSelect

# Played on the first act_select_show; later ones find the key already on
# screen and do nothing, while the clock counts from the event's `seconds`.
# MPF removes it when the mode stops.
widget_player:
  act_select_show:
    act_select:
      key: act_select
      priority: 10
      tokens:
        label: STARTING IN ACT I IN
        event: act_select_show
        arg: seconds
        seconds: "30"
