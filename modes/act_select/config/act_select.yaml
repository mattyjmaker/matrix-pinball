#config_version=6

# Act select, before each player's first ball. Logic in code/act_select.py.
# Skipped while only Act I has rules. See docs/11-rules-act-1.md, section 5.

mode:
  start_events: ball_starting{ball==1}
  use_wait_queue: true
  priority: 1000
  code: act_select.ActSelect

widget_player:
  act_select_show:
    mode_banner:
      key: act_select
      tokens:
        title: SELECT YOUR ACT
        detail: FLIPPERS CHANGE, START CONFIRMS
  mode_act_select_stopped:
    mode_banner:
      key: act_select
      action: remove
