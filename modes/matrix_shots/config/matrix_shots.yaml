#config_version=6

# The Matrix's names for the playfield shots.
#
# Every playfield switch posts a physical event (config/config.yaml and
# config/playfield_pending.yaml): what the hardware is, not what the theme
# calls it. This mode re-posts each one under its Matrix name, which is what
# base, the chapters, the multiballs and The One listen to. A second game
# adds its own shot mode with its own names for the same physical events, and
# only one game's shot mode runs at a time. See docs/12-rules-terminator-2.md,
# section 1.
#
# Events that already name the hardware (`ramp_hit`, `left_shot_hit`,
# `right_shot_hit`, `spinner_hit`, `kickback_target_hit`) are not re-posted;
# the rules use them as they are.
#
# | Switch             | Physical event                              | Matrix event                            |
# | s_trinity_ramp     | ramp_1_hit                                  | trinity_ramp_hit                        |
# | s_dejavu_ramp      | ramp_2_hit                                  | dejavu_ramp_hit                         |
# | s_real_world_ramp  | ramp_3_hit                                  | real_world_ramp_hit                     |
# | s_sentinel_ramp    | ramp_4_hit                                  | sentinel_ramp_hit                       |
# | s_real_world_1..3  | upper_target_N_hit, upper_target_hit        | real_world_N_hit, real_world_target_hit |
# | s_sentinel_left    | gate_left_target_hit, gate_entrance_hit     | sentinel_left_hit, sentinel_entrance_hit|
# | s_sentinel_right   | gate_right_target_hit, gate_entrance_hit    | sentinel_right_hit, sentinel_entrance_hit|
# | s_sentinel_boss    | gate_main_target_hit                        | sentinel_boss_hit                       |
# | s_sentinel_magnet  | magnet_hit                                  | sentinel_magnet_hit                     |
# | s_emp_target_1..4  | pop_target_N_hit, pop_target_hit            | emp_target_N_hit, emp_target_hit        |
# | s_ammo_target      | lock_2_target_hit                           | ammo_target_hit                         |

mode:
  # Runs on every ball, like base. Game Select will start it only when the
  # Matrix is the chosen game (docs/12, section 2).
  start_events: ball_starting
  priority: 150

event_player:
  ramp_1_hit: trinity_ramp_hit
  ramp_2_hit: dejavu_ramp_hit
  ramp_3_hit: real_world_ramp_hit
  ramp_4_hit: sentinel_ramp_hit
  upper_target_1_hit: real_world_1_hit
  upper_target_2_hit: real_world_2_hit
  upper_target_3_hit: real_world_3_hit
  upper_target_hit: real_world_target_hit
  gate_left_target_hit: sentinel_left_hit
  gate_right_target_hit: sentinel_right_hit
  gate_entrance_hit: sentinel_entrance_hit
  gate_main_target_hit: sentinel_boss_hit
  magnet_hit: sentinel_magnet_hit
  pop_target_1_hit: emp_target_1_hit
  pop_target_2_hit: emp_target_2_hit
  pop_target_3_hit: emp_target_3_hit
  pop_target_4_hit: emp_target_4_hit
  pop_target_hit: emp_target_hit
  lock_2_target_hit: ammo_target_hit
