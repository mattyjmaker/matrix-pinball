#config_version=6

# Chapter 2: Pescadero Break-Out, getting in. Hit the three Ward standups
# (the upper playfield targets) to get past the orderlies; the third requests
# Break-Out Multiball (t2_ch2_breakout_mb). A drain first ends the chapter,
# played. See docs/12-rules-terminator-2.md, section 7.

mode:
  start_events: start_t2_ch2
  stop_events: mode_t2_ch2_breakout_mb_started
  priority: 300

accruals:
  t2_ch2_orderlies:
    events:
      - upper_target_1_hit
      - upper_target_2_hit
      - upper_target_3_hit
    events_when_complete: t2_ch2_inside
    start_enabled: true

event_player:
  t2_ch2_inside: request_breakout_mb

variable_player:
  mode_t2_ch2_pescadero_started:
    objective:
      action: set
      string: "GETTING IN: HIT THE THREE WARD TARGETS"
  upper_target_hit:
    score: 50000

widget_player:
  mode_t2_ch2_pescadero_started:
    video_clip:
      tokens:
        clip: pescadero_breakin
      expire: 8s
    t2_card:
      priority: 10
      tokens:
        kicker: TERMINATOR 2  CHAPTER 2
        title: PESCADERO BREAK-OUT
        goal: HIT THE THREE WARD TARGETS
      expire: 5s
  upper_target_hit:
    t2_banner:
      tokens:
        title: ORDERLY DOWN
        detail: ""
      expire: 2s
